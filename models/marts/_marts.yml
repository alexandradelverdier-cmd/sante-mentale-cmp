version: 2

models:
  - name: mart_psy_ambulatoire__departements
    description: >
      Accès à la psychiatrie ambulatoire et au suivi à domicile par département et par année
      (psychiatrie de l'adulte, SAE 2023 à 2025, population Insee).
      Les ETP de personnel couvrent toute la psychiatrie de l'établissement : la SAE ne les isole pas pour les CMP.
    columns:
      - name: code_departement_sae
        data_tests: [not_null]
      - name: annee
        data_tests: [not_null]
      - name: nb_etablissements_modes_legaux_exclus
        description: Établissements dont les modes légaux de soins sont écartés pour incohérence entre PSY et PSY2.
      - name: actes_domicile
        description: Actes, soins et interventions à domicile ou en institution substitutive au domicile.
      - name: actes_consultation_pour_1000
        description: Actes en CMP et en unités de consultation de psychiatrie pour 1 000 adultes.
      - name: actes_domicile_perimetre_constant
        description: Actes à domicile hors établissements qui avaient une HAD psychiatrique avant 2024. À utiliser pour comparer les années.
      - name: part_actes_domicile
        description: Part du domicile dans l'activité consultations (CMP + unités de consultation) + domicile.
      - name: taux_occupation
        description: Journées réalisées / journées-lits exploitables. Peut dépasser 100 % en cas de suroccupation.
      - name: part_journees_sans_consentement
        description: Part des journées à temps complet en SDRE, SDT ou péril imminent (toutes disciplines, PSY2 n'étant pas ventilé).
      - name: journees_sans_consentement_pour_1000
        description: Journées à temps complet en SDRE, SDT ou péril imminent pour 1 000 adultes. À lire avec la part, qui varie mécaniquement avec les soins libres.
      - name: journees_soins_libres_pour_1000
        description: Journées à temps complet hors soins sans consentement pour 1 000 adultes.
