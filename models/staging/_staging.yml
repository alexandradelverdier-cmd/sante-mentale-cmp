version: 2

models:
  - name: stg_sae__etablissements
    description: Établissements interrogés par la SAE 2025, localisés au département de leur activité réelle.
    columns:
      - name: finess
        data_tests: [unique, not_null]
      - name: code_departement_sae
        data_tests: [not_null]

  - name: stg_sae__psy_activite
    description: Capacités, activité et personnel de psychiatrie, par établissement et discipline.
    columns:
      - name: discipline
        data_tests:
          - accepted_values:
              arguments:
                values: [GEN, INF, PEN, TOT]

  - name: stg_sae__psy_modes_legaux
    description: Journées d'hospitalisation à temps complet par mode légal de soins.
    columns:
      - name: finess
        data_tests: [unique, not_null]

  - name: stg_insee__population
    description: Population au 1er janvier 2023 par département et classe d'âge (Insee).
    columns:
      - name: code_departement_sae
        data_tests: [not_null]
